name: Deploy

# Run by hand from the Actions tab once CI is green. Needs the repository secrets DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY
# (a key whose public half is in the server user's authorized_keys); see DEPLOY.md.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which copy to update
        type: choice
        options: [cyberstation, cyberstation-beta]
        default: cyberstation-beta

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Update and restart on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TARGET: ${{ inputs.target }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$DEPLOY_SSH_KEY" > key
          PROFILE=""
          if [ "$TARGET" = "cyberstation-beta" ]; then PROFILE="--profile beta"; fi
          ssh -i key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/cyberstation && git pull --ff-only && docker compose $PROFILE up -d --build $TARGET caddy && docker image prune -f"
